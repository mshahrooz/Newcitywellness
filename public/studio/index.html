<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f7f9fd">
<title>New City Wellness · Page Studio</title>
<link rel="stylesheet" href="studio.css?v=inline-only1">
<link rel="stylesheet" href="studio-polish.css?v=inline3">
<script src="pages.js?v=drag-guides1" defer></script>
<script src="canvas-behavior.js?v=drag-guides1" defer></script>
<script src="../homepage-studio/page-runtime.js?v=drag-guides1" data-preview-runtime defer></script>
<script src="../homepage-studio/responsive-offsets.js?v=2" defer></script>
<script src="embeds.js?v=drag-guides1" defer></script>
<script src="columns.js?v=drag-guides1" defer></script>
<script src="grid.js?v=sticky-elements1" defer></script>
<script src="flow.js?v=studio-drag2" defer></script>
<script src="seo.js?v=1" defer></script>
<script src="element-icons.js?v=1" defer></script>
<script src="documents.js?v=verified-studio1" defer></script>
<script src="resize.js?v=1" defer></script>
<script src="device-layout.js?v=1" defer></script>
<script src="studio-workflow.js?v=merge1" defer></script>
<script src="text-edit.js?v=inline-only1" defer></script>
<script src="inline-text.js?v=3" defer></script>
<script src="studio.js?v=inline3" defer></script>
<script src="studio-revision.js?v=publish2" defer></script>
<script src="publisher-config.js" defer></script>
<script src="release-progress.js?v=2" defer></script>
<script src="publish.js?v=merge1" defer></script>
</head>
<body>
<header class="studio-bar">
  <div class="identity"><span class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M4 10h16M10 10v10m4-5h3"/></svg></span><div><strong>Page Studio</strong><small>NEW CITY WELLNESS</small></div></div>
  <label class="page-picker" for="page-picker"><span>Page</span><select id="page-picker" aria-label="Page to edit"><option value="home">Home</option></select></label>
  <div class="tools" aria-label="Page tools">
    <button id="add-section" type="button" title="Add a page section"><b aria-hidden="true">＋</b> Section</button>
    <button id="section-order" type="button" title="Jump to or reorder sections">↕ Sections</button>
    <button class="icon" id="undo" type="button" title="Undo (Ctrl + Z)" aria-label="Undo">↶</button>
    <button class="icon" id="redo" type="button" title="Redo (Ctrl + Shift + Z)" aria-label="Redo">↷</button>
  </div>
  <div class="devices" role="group" aria-label="Canvas width">
    <button type="button" data-view="desktop" title="Desktop" aria-label="Desktop" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4m-4 0h8"/></svg></button>
    <button type="button" data-view="tablet" title="Tablet" aria-label="Tablet" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M11 18h2"/></svg></button>
    <button type="button" data-view="mobile" title="Mobile" aria-label="Mobile" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/></svg></button>
  </div>
  <div class="tools right">
    <button type="button" id="page-seo" aria-label="Edit SEO settings for this page" aria-controls="popup" aria-expanded="false"><span aria-hidden="true">✦</span> Page SEO</button>
    <button type="button" id="preview" aria-pressed="false">Preview</button>
    <button type="button" id="revert" aria-label="Revert to Previous Version" aria-haspopup="dialog" hidden>Revert<span class="wide"> to Previous Version</span></button>
    <button type="button" class="accent" id="save"><span class="wide">Save </span>draft</button>
    <button type="button" class="publish-cta" id="publish">Publish<span class="wide"> page</span></button>
  </div>
</header>
<div id="subbar" class="subbar"><div><span class="badge"><span>●</span> Editor workspace</span><span class="hint" id="hint">Open Add Elements to drag in a new block, or move existing elements on the page.</span></div><span class="status-pair"><span id="publish-status" class="connection" role="status">Ready to edit</span><span class="saved" id="saved" role="status">Opening page…</span></span></div>
<div id="workspace">
<button type="button" id="add" aria-controls="element-sidebar" aria-expanded="false" title="Show Add Elements"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8m-4-4h8"/></svg> Add Elements</button>
<aside id="element-sidebar" aria-labelledby="element-sidebar-title" data-collapsed inert>
  <header class="element-sidebar-head">
    <div class="element-sidebar-heading"><span>BUILD</span><h2 id="element-sidebar-title">Add elements</h2></div>
    <button type="button" id="element-sidebar-close" aria-label="Collapse Add Elements" title="Collapse Add Elements"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m15 6-6 6 6 6"/></svg></button>
  </header>
  <div id="element-sidebar-body" class="element-sidebar-body"></div>
</aside>
<main id="stage" aria-label="Page editor canvas"><iframe id="canvas" title="New City Wellness page canvas" sandbox="allow-scripts allow-same-origin allow-presentation allow-downloads allow-popups allow-popups-to-escape-sandbox" allowfullscreen></iframe></main>
</div>
<div id="outline" hidden></div>
<div id="column-handles" role="group" aria-label="Resize column widths" hidden></div>
<div id="free-grid" aria-hidden="true" hidden></div>
<div id="free-ghost" aria-hidden="true" hidden><span id="free-ghost-label"></span></div>
<div id="palette-drag-chip" aria-hidden="true" hidden></div>
<div id="drop-target-outline" aria-hidden="true" hidden></div>
<div id="drop-guide" aria-hidden="true" hidden><span id="guide-label"></span></div>
<div id="selection" hidden role="toolbar" aria-label="Selected item tools">
    <button id="drag" type="button" title="Drag to position or insert this item. Hold Shift for free movement." aria-label="Move selected item">⠿</button>
    <button id="selection-settings" type="button" title="Edit selected item"><span aria-hidden="true">✎</span> <span id="selection-label">Edit</span></button>
    <button id="selection-duplicate" type="button" title="Duplicate selected element" aria-label="Duplicate selected element">⧉</button>
    <button id="selection-up" type="button" title="Move element up" aria-label="Move element up" hidden>↑</button>
    <button id="selection-down" type="button" title="Move element down" aria-label="Move element down" hidden>↓</button>
    <button id="selection-section" type="button" title="Select the surrounding section to resize it" aria-label="Select surrounding section to resize" hidden>Section</button>
    <button id="selection-add" type="button" title="Add an element here" aria-label="Add an element here">＋</button>
</div>
<div id="resize-handles" role="group" aria-label="Resize selection" hidden></div>
<output id="resize-size" aria-hidden="true" hidden></output>
<section class="popup" id="popup" role="dialog" aria-label="Edit item" hidden>
  <div class="popup-head"><div><span id="popup-type">ELEMENT SETTINGS</span><h2 id="popup-title">Edit item</h2></div><button id="popup-close" type="button" title="Close settings" aria-label="Close settings">×</button></div>
  <div class="popup-body" id="popup-body"></div>
  <div class="popup-footer" id="popup-footer" hidden><button class="delete-element" id="delete-element" type="button">Delete element</button></div>
</section>
<div id="toast" role="status" hidden></div>
<noscript>Page Studio requires JavaScript. <a href="canvas.html?v=studio-drag2">View the homepage copy.</a></noscript>
</body>
</html>
