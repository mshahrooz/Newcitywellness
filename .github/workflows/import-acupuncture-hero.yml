name: Import optimized acupuncture hero image
on:
  push:
    branches: [main]
    paths:
      - 'src/app/services/acupuncture/page.tsx'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Download and optimize hero photo
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps
          target = Path("public/images/services/acupuncture/hero-electro-needling.webp")
          if target.exists():
              print("Optimized image already exists")
          else:
              url = "https://newcitywellness.com/wp-content/uploads/2022/12/physiotherapist-performing-electro-dry-needling-patient-1-min.jpg"
              req = Request(url, headers={"User-Agent": "Mozilla/5.0"})
              data = urlopen(req, timeout=45).read()
              image = ImageOps.exif_transpose(Image.open(BytesIO(data))).convert("RGB")
              image.thumbnail((1600, 1000), Image.Resampling.LANCZOS)
              target.parent.mkdir(parents=True, exist_ok=True)
              image.save(target, "WEBP", quality=82, method=6)
              print("Saved", target, target.stat().st_size, image.size)
          PY
      - name: Commit locally hosted image
        run: |
          git add public/images/services/acupuncture/hero-electro-needling.webp
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Store optimized acupuncture hero image locally'
            git push
          fi
