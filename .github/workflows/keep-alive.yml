name: Supabase Keep Alive

on:
  schedule:
    # 06:17, 14:17, and 22:17 Pakistan time, daily.
    - cron: '17 1,9,17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keep-alive.yml'
      - 'public/studio/publisher-config.js'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read one health row from Supabase
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { setTimeout as sleep } from 'node:timers/promises';

          // Reuse the public settings shipped with Studio. No elevated key is needed.
          const config = readFileSync('public/studio/publisher-config.js', 'utf8');
          const url = config.match(/\burl:\s*['"](https:\/\/[a-z0-9]+\.supabase\.co)['"]/)?.[1];
          const key = config.match(/\bkey:\s*['"](sb_publishable_[A-Za-z0-9_-]+)['"]/)?.[1];
          if (!url || !key) throw new Error('Studio is missing a valid Supabase URL or publishable key.');

          for (let attempt = 1; attempt <= 3; attempt++) {
            const response = await fetch(url + '/rest/v1/rpc/studio_keep_alive', {
              headers: { apikey: key, Accept: 'application/json' },
              redirect: 'error',
              signal: AbortSignal.timeout(10000),
            }).catch(() => null);

            if (response?.ok) {
              const rows = await response.json();
              if (!Array.isArray(rows) || rows.length !== 1 || rows[0]?.ok !== true) {
                throw new Error('Supabase did not return the expected single health row.');
              }
              console.log('Supabase keep-alive succeeded (one read-only row).');
              break;
            }
            const status = response?.status;
            if (attempt === 3 || status && status !== 429 && status < 500) {
              throw new Error('Supabase keep-alive failed: ' + (status ? 'HTTP ' + status : 'network unavailable or timed out'));
            }
            await sleep(attempt * 2000);
          }
          NODE

  record-health:
    # Only this isolated job can write one operational status file.
    if: ${{ !cancelled() && github.repository == 'mshahrooz/Newcitywellness' && github.ref == 'refs/heads/main' && (needs.probe.result == 'success' || needs.probe.result == 'failure') }}
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    concurrency:
      group: studio-supabase-health-record
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Record the check when the repository has been quiet
        shell: bash
        env:
          PROBE_RESULT: ${{ needs.probe.result }}
        run: |
          set -euo pipefail
          report=.github/uptime/supabase.json
          head=$(git rev-parse HEAD)
          age=$(( $(date +%s) - $(git log -1 --format=%ct HEAD) ))
          # Record the first real test, then only after 35 days with no commits.
          if [[ -f "$report" && "$age" -lt $((35 * 86400)) ]]; then
            echo 'Recent repository activity detected. No health record commit needed.'
            exit 0
          fi

          case "$PROBE_RESULT" in success|failure) ;; *) exit 1 ;; esac
          mkdir -p "$(dirname "$report")"
          printf '{\n  "checked_at": "%s",\n  "result": "%s",\n  "run_id": "%s"\n}\n' \
            "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$PROBE_RESULT" "$GITHUB_RUN_ID" > "$report"
          git add -- "$report"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Record Studio Supabase health check'
          if ! git push origin HEAD:refs/heads/main; then
            current=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
            if [[ "$current" == "$head" ]]; then exit 1; fi
            echo 'Main advanced during the health check. The newer commit already provides repository activity.'
          fi
