# Deploy the Next.js site to GitHub Pages as a fully static export.
#
# No design or layout changes are needed — the app is statically exported
# (output: "export") and served as-is. The workflow auto-detects whether
# the repository is a user/org page (served from "/") or a project page
# (served from "/<repo>") and sets the basePath accordingly.
#
# One-time setup in your GitHub repo:
#   Settings  ->  Pages  ->  Build and deployment  ->  Source: GitHub Actions
#
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - ".github/uptime/supabase.json"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, cancelling runs in-progress.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute base path
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%/*}"
          if [[ "$REPO" == "$OWNER.github.io" ]]; then
            # User/org page -> served from site root
            echo "BASE_PATH=" >> "$GITHUB_ENV"
          else
            # Project page -> served from /<repo>
            echo "BASE_PATH=/$REPO" >> "$GITHUB_ENV"
          fi

      - name: Fingerprint the original site
        id: inputs
        run: echo "key=pages-static-v1-${{ runner.os }}-${{ runner.arch }}-$(python3 scripts/pages-base-cache.py fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Restore original site export
        id: base-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: out
          key: ${{ steps.inputs.outputs.key }}

      - name: Check the cached export
        id: cached
        env:
          CACHE_HIT: ${{ steps.base-cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.inputs.outputs.key }}
        run: |
          if [[ "$CACHE_HIT" == "true" && -s out/index.html && -d out/_next/static && -f out/.ncw-static-base ]] &&
             [[ "$(cat out/.ncw-static-base)" == "${CACHE_KEY##*-}" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Using the cached base site"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.cached.outputs.ready != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        if: steps.cached.outputs.ready != 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.cached.outputs.ready != 'true'
        run: bun install --frozen-lockfile

      - name: Build the original static site
        if: steps.cached.outputs.ready != 'true'
        run: python3 scripts/pages-base-cache.py build
        env:
          BUILD_TARGET: pages
          BASE_PATH: ${{ env.BASE_PATH }}

      - name: Cache the original static export
        if: steps.cached.outputs.ready != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: out
          key: ${{ steps.inputs.outputs.key }}

      - name: Apply the latest Studio publications
        run: |
          rm -f out/.ncw-static-base
          cp -a public/. out/
          python3 scripts/apply-homepage-studio.py out --base-path "$BASE_PATH"

      - name: Check for external image URLs
        run: python3 scripts/check_local_images.py out

      - name: Ensure .nojekyll
        run: touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for Pages to see the uploaded artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: python3 scripts/wait-pages-artifact.py

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          reporting_interval: 2000

      # The runner's artifact catalog can lag the REST API. Only retry
      # creation if the first action did not receive a deployment URL.
      - name: Wait for artifact metadata to catch up
        if: steps.deployment.outcome == 'failure' && steps.deployment.outputs.page_url == ''
        run: sleep 6

      - name: Retry starting the Pages deployment
        id: deployment-retry
        if: steps.deployment.outcome == 'failure' && steps.deployment.outputs.page_url == ''
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          reporting_interval: 2000

      - name: Report a failed Pages deployment
        if: steps.deployment.outcome == 'failure' && steps.deployment.outputs.page_url != ''
        run: |
          echo "::error::GitHub Pages started the deployment but did not complete it."
          exit 1
